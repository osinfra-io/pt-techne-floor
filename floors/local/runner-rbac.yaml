# The tofu-controller chart owns the tf-runner ServiceAccount and its state backend
# permissions; the floor only adds what the fixture itself provisions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: floor-fixture-runner
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: floor-fixture-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: floor-fixture-runner
subjects:
  - kind: ServiceAccount
    name: tf-runner
    namespace: pt-techne-floor-fixture
