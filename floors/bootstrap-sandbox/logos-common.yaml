apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: logos-common
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: logos-bootstrap-backend
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./workspace
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: logos-bootstrap-a37204ed3b7715886c5d7de1f98787ea5814f26e
  storeReadablePlan: json
  varsFrom:
    - kind: ConfigMap
      name: logos-bootstrap-inputs
