apiVersion: v1
kind: ServiceAccount
metadata:
  name: tf-bootstrap
  namespace: pt-bootstrap-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tf-bootstrap-state
  namespace: pt-bootstrap-sandbox
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tf-bootstrap-state
  namespace: pt-bootstrap-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tf-bootstrap-state
subjects:
  - kind: ServiceAccount
    name: tf-bootstrap
    namespace: pt-bootstrap-sandbox
